<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Box -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#discGrad)" stroke="#334155" stroke-width="3" />
  <!-- Vinyl Circles -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="50" cy="50" r="26" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.8" />
  <!-- Center Vinyl Label -->
  <circle cx="50" cy="50" r="16" fill="url(#brandGrad)" />
  <!-- Center Spindle Hole -->
  <circle cx="50" cy="50" r="5" fill="#0B0F17" />
  <!-- Equalizer / Rating waves accent -->
  <rect x="70" y="24" width="4" height="12" rx="2" fill="#10B981" />
  <rect x="76" y="20" width="4" height="16" rx="2" fill="#34D399" />
  <rect x="82" y="26" width="4" height="10" rx="2" fill="#10B981" />
</svg>
